name: crete
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  app_links: ^6.4.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.0
  dio: ^5.8.0+1
  equatable: ^2.0.7
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^19.3.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.15
  get_it: ^8.0.3
  go_router: ^14.6.2
  http: ^1.2.2
  injectable: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0
  local_auth: ^2.3.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.1
  permission_handler: ^12.0.1
  retrofit: ^4.5.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  solana: ^0.31.2+1
  solana_mobile_client: ^0.1.2
  url_launcher: ^6.2.6
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1
  crypto: ^3.0.3
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.0.6
  
  # App Icon Generation
  flutter_launcher_icons: ^0.13.1
  
  # Splash Screen Generation
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  
  # Internationalization support
  generate: true
  
  # Assets
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/

  # Fonts
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SFPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/SFPro-Medium.ttf
          weight: 500
        # - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
          # weight: 600

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/transparent/appstore.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true # Remove alpha channel for iOS App Store compliance
  web:
    generate: true
    image_path: "assets/icons/transparent/appstore.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/icons/transparent/appstore.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/transparent/appstore.png"
  linux:
    generate: true
    image_path: "assets/icons/transparent/appstore.png"

# Splash Screen Configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/transparent/appstore.png"
  color_dark: "#000000"
  image_dark: "assets/icons/dark/appstore.png"
  
  android_12:
    image: "assets/icons/transparent/appstore.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/icons/dark/appstore.png"
    icon_background_color_dark: "#000000"
  
  web: false # Disable web splash screen for better performance
  
  android: true
  ios: true
  
  fullscreen: true
  
  info_plist_files:
    - "ios/Runner/Info.plist"
